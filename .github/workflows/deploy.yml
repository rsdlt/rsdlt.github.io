name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Daily rebuild so scheduled posts (future pubDatetime) go live. Cron is
  # UTC: 14:17, 15:17 and 16:17 UTC keep a run soon after 9:00
  # America/Chicago in both CDT and CST. GitHub drops scheduled runs under
  # load, most often on the hour, hence the odd minute and the spare runs.
  schedule:
    - cron: "17 14-16 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
