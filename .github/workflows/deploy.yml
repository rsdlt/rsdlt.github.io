name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Daily rebuild so scheduled posts (future pubDatetime) go live. Cron is
  # UTC; two runs keep 9:00 America/Chicago covered across daylight saving:
  # 14:00 UTC is 9:00 CDT, 15:00 UTC is 9:00 CST.
  schedule:
    - cron: "0 14 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
